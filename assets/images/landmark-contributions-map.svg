<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Linear timeline of Hogenesch Lab contributions</title>
  <desc id="desc">A chronological timeline showing major published contributions from 1998 through 2018: core clock loop, Gene Atlas, RORE loop, algorithms, mouse organ atlas, CYCLOPS, and human circadian atlas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg); }
      .line { fill: none; stroke: #c8dbee; stroke-width: 8; stroke-linecap: round; }
      .leader { fill: none; stroke: #d8e6f3; stroke-width: 4; }
      .point { fill: #1f4e79; }
      .card { fill: #ffffff; stroke: #dce7f1; stroke-width: 2.5; }
      .eyebrow { fill: #1f4e79; font: 700 15px Inter, Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
      .year { fill: #5a5f66; font: 700 18px Inter, Arial, sans-serif; }
      .title { fill: #1f4e79; font: 700 25px Inter, Arial, sans-serif; }
      .copy { fill: #33404d; font: 400 18px "Source Serif Pro", Georgia, serif; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="620" rx="32"/>
  <text class="eyebrow" x="24" y="32">Contributions</text>
  <path class="line" d="M100 350 H1400"/>

  <g>
    <line class="leader" x1="160" y1="350" x2="160" y2="167"/>
    <circle class="point" cx="160" cy="350" r="11"/>
    <rect class="card" x="24" y="55" width="292" height="112" rx="24"/>
    <text class="title" x="52" y="94">Core loop</text>
    <text class="copy" x="52" y="126">BMAL1, CLOCK</text>
    <text class="copy" x="52" y="150">NPAS2, BMAL2</text>
    <text class="year" x="160" y="392" text-anchor="middle">1998</text>
  </g>

  <g>
    <line class="leader" x1="360" y1="350" x2="360" y2="435"/>
    <circle class="point" cx="360" cy="350" r="11"/>
    <rect class="card" x="190" y="435" width="320" height="120" rx="24"/>
    <text class="title" x="218" y="480">Gene Atlas</text>
    <text class="copy" x="218" y="514">Circadian map, 2002</text>
    <text class="copy" x="218" y="539">Tissue atlas, 2004</text>
    <text class="year" x="360" y="392" text-anchor="middle">2002</text>
  </g>

  <g>
    <line class="leader" x1="520" y1="350" x2="520" y2="302"/>
    <circle class="point" cx="520" cy="350" r="11"/>
    <rect class="card" x="350" y="190" width="300" height="112" rx="24"/>
    <text class="title" x="378" y="236">RORE loop</text>
    <text class="copy" x="378" y="270">RORA, Sato et al., 2004</text>
    <text class="year" x="520" y="392" text-anchor="middle">2004</text>
  </g>

  <g>
    <line class="leader" x1="750" y1="350" x2="750" y2="435"/>
    <circle class="point" cx="750" cy="350" r="11"/>
    <rect class="card" x="610" y="435" width="320" height="120" rx="24"/>
    <text class="title" x="638" y="480">Algorithms</text>
    <text class="copy" x="638" y="514">JTK_CYCLE, PSEA</text>
    <text class="copy" x="638" y="539">MetaCycle</text>
    <text class="year" x="750" y="392" text-anchor="middle">2010</text>
  </g>

  <g>
    <line class="leader" x1="970" y1="350" x2="970" y2="167"/>
    <circle class="point" cx="970" cy="350" r="11"/>
    <rect class="card" x="700" y="55" width="360" height="112" rx="24"/>
    <text class="title" x="728" y="101">Mouse organ atlas</text>
    <text class="copy" x="728" y="135">Circadian expression across organs</text>
    <text class="year" x="970" y="392" text-anchor="middle">2014</text>
  </g>

  <g>
    <line class="leader" x1="1190" y1="350" x2="1190" y2="435"/>
    <circle class="point" cx="1190" cy="350" r="11"/>
    <rect class="card" x="1040" y="435" width="330" height="120" rx="24"/>
    <text class="title" x="1068" y="480">CYCLOPS</text>
    <text class="copy" x="1068" y="514">Temporal order from</text>
    <text class="copy" x="1068" y="539">human transcriptomes</text>
    <text class="year" x="1190" y="392" text-anchor="middle">2017</text>
  </g>

  <g>
    <line class="leader" x1="1335" y1="350" x2="1335" y2="302"/>
    <circle class="point" cx="1335" cy="350" r="11"/>
    <rect class="card" x="1110" y="190" width="365" height="112" rx="24"/>
    <text class="title" x="1138" y="236">Human circadian atlas</text>
    <text class="copy" x="1138" y="270">Human transcriptomic structure</text>
    <text class="year" x="1335" y="392" text-anchor="middle">2018</text>
  </g>
</svg>
